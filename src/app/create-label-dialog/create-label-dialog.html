<h2>Create new label</h2>

<mat-dialog-content>

    <mat-form-field appearance="outline" class="full-width">
        <mat-label>Label Name</mat-label>
        <input matInput [(ngModel)]="labelName" maxlength="50" placeholder="Enter label name">
    </mat-form-field>

</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">
        cancel
    </button>

    <button mat-flat-button type="button" (click)="createLabel()" [disabled]="!labelName.trim()">
        {{isEditMode ? 'Save' : 'Create'}}
    </button>
</mat-dialog-actions>
