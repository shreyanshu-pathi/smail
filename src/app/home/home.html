<div class="headerContent">

    <header class="header-container">

        <!-- Logo -->
        <div class="logo">
            <mat-icon>email</mat-icon>
            <span class="gmail-text" routerLink="/home">Smail</span>
        </div>

        <!-- Navigation -->
        <nav class="nav-links">
            <a href="#features">Features</a>
            <a href="#security">Security</a>
            <a href="#workspace">Workspace</a>
        </nav>

        <!-- Actions -->
        <div class="rightPanel">
            <button mat-button class="signInBtn" (click)="goToLogin()">Sign in</button>
            <button mat-flat-button class="signupBtn" (click)="goToSignup()">Create an account</button>
        </div>

    </header>
</div>

<!-- Main Content -->
<div class="hero-section">

    <div class="hero-content">
        <span class="welcome-text">WELCOME TO</span>

        <h1>
            <span>SMAIL</span>
        </h1>

        <p>
            Stay connected, organize your conversations, and manage your emails effortlessly with Smail.
        </p>

        <div class="hero-buttons">
            <button mat-flat-button class="btn" (click)="goToSignup()">
                Get Started
            </button>

            <button mat-button class="signin-btn" (click)="goToLogin()">
                Sign in
            </button>
        </div>
    </div>

</div>
