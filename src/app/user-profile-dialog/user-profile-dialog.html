<h2>User Profile</h2>

<mat-dialog-content>

    <mat-form-field appearance="outline" class="full-width">
        <mat-label>Name</mat-label>
        <input matInput [(ngModel)]="data.name" readonly>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
        <mat-label>Date of Birth</mat-label>
        <input matInput [value]="data.dob | date:'dd/MM/yyyy'" readonly>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
        <mat-label>Gender</mat-label>
        <input matInput [(ngModel)]="data.gender" readonly>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
        <mat-label>Phone</mat-label>
        <input matInput type="tel" maxlength="10" [(ngModel)]="data.phone" readonly>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput [(ngModel)]="data.email" readonly>
    </mat-form-field>

    <mat-dialog-actions align="end">
        <button mat-stroked-button (click)="close()">Cancel</button>
        <button mat-raised-button (click)="save()">Save</button>
    </mat-dialog-actions>

</mat-dialog-content>
